<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="motion.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F7E1D2}
.abs{position:absolute}
/* a shopfront drawn in CSS: facade, signboard, opening, shutter */
.facade{left:90px;top:300px;width:900px;height:1180px;background:#F2CFC4}
.sign{left:150px;top:360px;width:780px;height:170px;background:#4E3C66;display:flex;align-items:center;justify-content:center;flex-direction:column}
.sign .en{font-family:Velista;font-size:86px;color:#FFF8F5;letter-spacing:.04em;line-height:1}
.sign .mr{font-family:'Tiro Devanagari Marathi';font-size:40px;color:#E7C27A;margin-top:6px}
.opening{left:190px;top:600px;width:700px;height:760px;background:#FBF3EC;overflow:hidden}
.counter{left:0;top:560px;width:700px;height:200px;background:#C9B6CB}
.piece{left:150px;top:250px;width:400px}
.shutter{left:0;top:0;width:700px;height:760px}
.tube{left:250px;top:24px;width:200px;height:12px;background:#FFFDF2;box-shadow:0 0 30px 8px rgba(255,250,220,.8)}
.line1{left:110px;top:1560px;font-family:Velista;font-size:96px;color:#4E3C66}
.aside{left:114px;top:1690px;font-family:'Cormorant Garamond';font-style:italic;font-size:52px;color:#5E4A78}
.flame{left:525px;top:1490px}
.glow{left:470px;top:1440px;width:130px;height:130px}
svg.drawing{left:0;top:0}
</style></head><body>
<div class="abs facade m" style="animation-name:fade-in;animation-duration:.6s"></div>
<svg class="abs drawing" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- awning scallops drawn by line -->
  <path class="draw" pathLength="1" d="M90 560 q50 50 100 0 q50 50 100 0 q50 50 100 0 q50 50 100 0 q50 50 100 0 q50 50 100 0 q50 50 100 0 q50 50 100 0 q50 50 100 0" stroke="#4E3C66" stroke-width="5" style="animation:draw 1.6s var(--ease-inout) .3s both"/>
</svg>
<div class="abs sign m" style="animation-name:rise-in;animation-delay:.5s"><div class="en">FANCY STORE</div><div class="mr">फॅन्सी स्टोअर</div></div>
<div class="abs opening">
  <div class="abs counter"></div>
  <div class="abs tube" style="animation:light-on 1.2s linear 2.6s both"></div>
  <img class="abs piece cut m" src="../../cutouts/woven-gold-hoops/00-trim.png" style="animation-name:drop-in;animation-timing-function:var(--ease-drop);animation-delay:3.2s;animation-duration:1.1s">
  <div class="abs glint" style="left:150px;top:250px;width:400px;height:400px;--src:url(../../cutouts/woven-gold-hoops/00-trim.png);animation:glint 1.4s var(--ease-inout) 4.6s both"></div>
  <div class="abs shutter" style="animation:shutter-up 2.2s var(--ease-inout) 1s both"></div>
</div>
<div class="abs line1"><span class="line"><span class="m" style="display:inline-block;animation-name:type-up;animation-delay:5.2s">REAL EARRINGS.</span></span></div>
<div class="abs aside m" style="animation-name:fade-in;animation-delay:5.8s">woven, not cast.</div>
<div class="abs glow" style="animation:glow-breathe 2.4s ease-in-out 0s infinite both"></div>
<div class="abs flame" style="animation:flicker 1.1s ease-in-out 0s infinite both"></div>
</body></html>
