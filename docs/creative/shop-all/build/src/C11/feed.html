<script>
const NS='http://www.w3.org/2000/svg';
let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const J=(a)=> (rnd()*2-1)*a;
function path(d,w,op){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');
 p.setAttribute('stroke','#D23B2A');p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
 p.setAttribute('opacity',op||.92);document.getElementById('ink').appendChild(p);}
function box(el){const r=document.createRange();r.selectNodeContents(el.firstChild.nodeType===3?el:el);const b=el.getBoundingClientRect();return b}
function draw(){
 // wavy underline under the title
 const t=document.getElementById('title'); const tb=t.getBoundingClientRect(); const fs=parseFloat(t.style.fontSize);
 const base=tb.top+0.766*fs; let y=base+0.335*fs; let x=tb.left-4, x1=tb.right+8; let d=`M${x} ${y+J(1)}`;
 const n=Math.round((x1-x)/44); const step=(x1-x)/n;
 for(let i=0;i<n;i++){const a=x+step*i, b=a+step; const amp=4.2+J(1.2); d+=` Q${a+step*.25} ${y-amp} ${a+step*.5} ${y+J(.6)} T${b} ${y+J(.6)}`;}
 path(d,6);
 // hand-drawn tick before each name: short dip, long flick up past the cap height
 document.querySelectorAll('.tick').forEach((el,i)=>{const f=parseFloat(el.style.fontSize);
  const L=parseFloat(el.dataset.x)+2, bl=parseFloat(el.dataset.base); const w=0.74*f, h=0.80*f;
  const ax=L+J(1), ay=bl-0.36*h+J(1.5);            // start of the short stroke
  const vx=L+0.33*w+J(1), vy=bl+0.02*f+J(1);        // the dip
  const tx=L+w+J(1.5), ty=bl-h+J(1.5);              // end of the flick
  path(`M${ax} ${ay} Q${ax+0.13*w} ${ay+0.20*h} ${vx} ${vy} Q${vx+0.20*w} ${vy-0.52*h} ${tx} ${ty}`,7);});
 // hand-drawn double underline under the twist (the list's total), clear of the descenders
 const w=document.getElementById('twist'); const wb=w.getBoundingClientRect(); const wf=parseFloat(w.style.fontSize);
 const wbl=wb.top+0.766*wf; const u1=wbl+26, u2=u1+9; const l=wb.left, r=wb.right;
 path(`M${l-6} ${u1+1.5} Q${(l+r)/2} ${u1-2.5} ${r+8} ${u1-0.5}`,4);
 path(`M${l+10} ${u2+1} Q${(l+r)/2+40} ${u2-2} ${r-6} ${u2+0.5}`,4);
}
document.fonts.ready.then(draw);
</script>
