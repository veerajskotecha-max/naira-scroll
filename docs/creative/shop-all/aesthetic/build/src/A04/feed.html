<script>
function place(){
  const W=1080;
  const els=[...document.querySelectorAll('[data-base]')];
  // baseline
  for(const el of els){
    el.style.top='0px';
    const p=document.createElement('span');
    p.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
    el.appendChild(p);
    const off=p.getBoundingClientRect().top-el.getBoundingClientRect().top;
    p.remove();
    el.style.top=(+el.dataset.base-off)+'px';
  }
  // ink-width (exclude trailing letter-spacing) for centring
  function inkW(el){
    const r=document.createRange(); r.selectNodeContents(el);
    const rs=[...r.getClientRects()];
    const ls=parseFloat(getComputedStyle(el).letterSpacing)||0;
    return el.getBoundingClientRect().width-ls;
  }
  for(const el of els.filter(e=>e.dataset.center)){
    el.style.left=Math.round((W-inkW(el))/2)+'px';
  }
  const groups={};
  for(const el of els.filter(e=>e.dataset.group)){(groups[el.dataset.group]=groups[el.dataset.group]||[]).push(el)}
  for(const g of Object.values(groups)){
    const w=Math.max(...g.map(inkW));
    const L=Math.round((W-w)/2);
    g.forEach(el=>el.style.left=L+'px');
  }
  document.body.dataset.placed='1';
}
document.fonts.ready.then(place);
</script>
