<script>
// Place each .bl element so its text baseline sits exactly on data-b (px).
function place(){
  document.querySelectorAll('.bl').forEach(el=>{
    el.style.top='0px';
    const m=document.createElement('i');
    m.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
    el.appendChild(m);
    const b=m.getBoundingClientRect().bottom;
    el.removeChild(m);
    el.style.top=(+el.dataset.b - b)+'px';
  });
}
document.fonts.ready.then(place);
</script>
