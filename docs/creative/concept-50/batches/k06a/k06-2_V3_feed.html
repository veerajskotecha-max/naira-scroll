<style>
 body { background: #140D0C; }
 .pic { object-position: 50% 54%; }
 .layer { position: absolute; pointer-events: none; }

 .beat { position: absolute; color: var(--gold-light); white-space: nowrap; line-height: 1.14; }

 .pad { position: absolute; width: 226px; transform-origin: 50% 0; }
 .pad .sh { position: absolute; inset: 0; background: #000; opacity: .7; transform: translate(10px, 12px); }
 .pad .stub { position: absolute; left: 0; right: 0; }
 .pad .bind { position: relative; height: 22px; background: #6E1F23; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }

 .pad .t { display: block; margin: 0; white-space: nowrap; }
 .pad .mon { font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .3em; padding-left: .3em; text-transform: uppercase; color: var(--tink); line-height: 1; }

 .pad .roz { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 32px; color: var(--ink); line-height: 1; margin-top: 4px; }
 .pad .rule { display: block; height: 0; border-top: 2px solid rgba(26,22,20,.18); margin: 14px 26px 0; }
 /* STRIP */
 .strip { position: absolute; transform-origin: 50% 50%; }
 .strip svg.paper { position: absolute; left: 0; top: 0; }

 .strip .hd { position: absolute; margin: 0; white-space: nowrap; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: rgba(26,22,20,.72); line-height: 1; }
 .strip .w { position: absolute; margin: 0; white-space: nowrap; font-family: var(--serif); font-style: italic; font-weight: 600; color: var(--tink); line-height: 1; }
 .strip .w s { text-decoration: none; position: relative; }
 .strip .w s::after { content: ""; position: absolute; left: -8px; right: -8px; top: 56%; height: 3px; background: var(--ink); transform: rotate(-4deg); border-radius: 2px; }

 .f2 { position: absolute; color: var(--ink); }
 .f2 .wm { display: block; height: 36px; width: auto; }

 .ob .sep { display: inline-block; width: 9px; height: 9px; background: var(--tink); transform: rotate(45deg); vertical-align: middle; margin: -4px 14px 0 12px; }

 .stamp text { font-family: var(--sans); font-weight: 500; letter-spacing: .06em; font-size: 26px; }
