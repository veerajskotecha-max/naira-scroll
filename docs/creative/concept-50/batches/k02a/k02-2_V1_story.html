<style>
 body { background: #24141E; }
 .pic { object-position: 50% 50%; }
 svg.fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; overflow: visible; }
 svg.mul { mix-blend-mode: multiply; }
 svg.scr { mix-blend-mode: screen; }
 /* OSD: the camcorder REC readout, Jost bone with the hard 2 px ink shadow */
 .osd { position: absolute; left: 72px; color: var(--bone); font-family: var(--sans); text-shadow: 2px 2px 0 rgba(26,22,20,.6); white-space: nowrap; }
 .osd .rec { display: flex; align-items: center; gap: 14px; font-weight: 500; font-size: 30px; letter-spacing: .14em; line-height: 1; }
 .osd .rec svg { display: block; filter: drop-shadow(2px 2px 0 rgba(26,22,20,.6)); }
 .osd .tape { margin-top: 12px; font-weight: 400; font-size: 26px; letter-spacing: .14em; line-height: 1; }
 .bug { position: absolute; right: 72px; height: 56px; opacity: .88; }
 /* The 90s title super: Velista caps in gold-light, a bone outline, a soft cocoa drop */
 .super { position: absolute; margin: 0; font-family: var(--display); text-transform: uppercase; font-weight: 400; line-height: 1;
          letter-spacing: .04em; color: var(--gold-light); white-space: nowrap; font-variant-ligatures: none;
          font-feature-settings: "liga" 0, "dlig" 0, "calt" 0, "swsh" 0, "salt" 0;
          -webkit-text-stroke: 3px var(--bone); paint-order: stroke fill; text-shadow: 0 6px 18px rgba(59,38,32,.7); }
 .sub { position: absolute; margin: 0; font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--bone);
        line-height: 1.12; white-space: nowrap; }
 /* The lower third: a 90s name super, cocoa at 94% under a 2 px gold-light hairline */
 .l3 { position: absolute; background: rgba(59,38,32,.94); border-top: 2px solid var(--gold-light); }
 .np { display: flex; align-items: baseline; gap: 26px; }
 .name { font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; color: var(--bone); white-space: nowrap; }
 .price { font-family: var(--serif); font-weight: 500; font-size: 56px; line-height: 1; color: var(--gold-light); white-space: nowrap; font-variant-numeric: lining-nums; }
 .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--bone); white-space: nowrap; }
 .offer { color: var(--bone); white-space: nowrap; }
 .edge { font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .14em; fill: var(--bone); fill-opacity: .9; }

 .t1 { right: 72px; text-align: right; top: 394px; font-size: 96px; line-height: 1.02; letter-spacing: 0.04em; }
 .b1 { right: 72px; text-align: right; top: 608px; font-size: 42px; }
 .l3s { position: absolute; right: 72px; top: 970px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
 .l3s .price { margin: -4px 0 0; }
 .o2 { display: grid; grid-template-columns: auto auto; column-gap: 14px; row-gap: 4px; padding: 12px 18px; letter-spacing: .08em; line-height: 1.15;
       font-family: var(--sans); font-weight: 500; font-size: 26px; text-transform: uppercase; border: 2px solid currentColor; margin-top: 4px; }
 .o2 .k { text-align: right; }
 .o2 .sep { margin: -4px 2px 0 0; }
 .l3s .trust { letter-spacing: .12em; margin-top: 4px; }
 .edge { letter-spacing: .12em; }
</style></head>
