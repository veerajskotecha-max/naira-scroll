<style>

 body { background: #120C0A; }
 .layer { position: absolute; pointer-events: none; }
 /* THE LOG: seven-segment inverter readout (SVG) + Jost line */
 .log { position: absolute; display: flex; align-items: flex-end; gap: 18px; white-space: nowrap; }
 .log .ln { font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 1; letter-spacing: .16em; text-transform: uppercase;
            color: rgba(244,240,232,.74); padding-bottom: 1px; }

 .h1 { position: absolute; color: var(--bone); white-space: nowrap; line-height: .96; letter-spacing: .02em; text-shadow: 0 0 26px rgba(240,214,190,.22); }

 .beat { position: absolute; white-space: nowrap; line-height: 1.1; font-size: 44px;
         background: linear-gradient(90deg, #B9A0E0 0%, #D9A6DA 30%, #F0AACB 55%, #F2C3A0 78%, #EEDF7E 100%);
         -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 4px 6px 0; }
 /* SIZE TAPE */
 .tapelab { position: absolute; transform-origin: 50% 50%; }
 .tapelab .tx { position: relative; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .1em; text-transform: uppercase;
                color: #1A1614; line-height: 31px; white-space: nowrap; text-align: center; }

 .foot { position: absolute; left: 0; right: 0; }
 .wmk { position: absolute; height: 56px; width: auto; }
 .nm { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; color: var(--bone); line-height: 1; white-space: nowrap; }
 .pr { position: absolute; font-family: var(--serif); font-weight: 500; color: var(--bone); line-height: 1; white-space: nowrap; font-feature-settings: "lnum" 1; }
 .ofr { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .12em; text-transform: uppercase; color: var(--bone);
        border: 2px solid rgba(244,240,232,.92); padding: 13px 24px 12px; line-height: 1.15; white-space: nowrap; }
 .ofr .sep { display: inline-block; width: 10px; height: 10px; background: #E8A33A; transform: rotate(45deg); vertical-align: middle; margin: -4px 18px 0 16px; }
 .trust { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .14em; text-transform: uppercase;
          color: rgba(244,240,232,.86); line-height: 1; white-space: nowrap; }
 .hair { position: absolute; height: 1px; background: rgba(244,240,232,.28); }
 /* SWITCHBOARD (the spec device): ivory plate, piano rockers, saffron neon, masking-tape labels */
 .plate { position: absolute; border-radius: 9px; background: radial-gradient(120% 140% at 18% 0%, #E6DFD0 0%, #D2C9B6 48%, #A99F8B 100%);
          box-shadow: 0 0 0 1px #3B3430, 0 14px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 3px rgba(80,66,50,.18); }
 .plate .unit { position: absolute; }
 .plate .lab { position: absolute; transform-origin: 50% 50%; }
 .plate .lab .tx { position: relative; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .1em; text-transform: uppercase;

 .plate .rk { position: absolute; }

 .plate .sw { position: absolute; }
