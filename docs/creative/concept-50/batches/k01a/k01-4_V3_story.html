<style>
 body { background: #1E0F1A; }
 .lens, .lineup, .ovl { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
 .scrim { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
 .rail { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .14em; text-transform: uppercase;
         color: var(--gold-light); white-space: nowrap; line-height: 1; margin: 0; }
 .chart { position: absolute; margin: 0; }
 .chart .row { display: flex; align-items: baseline; white-space: nowrap; }
 .chart .acu { flex: none; width: 76px; font-family: var(--sans); font-weight: 300; font-size: 26px; letter-spacing: 0; color: var(--gold-light); }
 .chart .h1 { color: var(--bone); line-height: .98; }
 .punch { position: absolute; white-space: nowrap; color: var(--gold-light); margin: 0; }
 .tag { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .12em; text-transform: uppercase;
        color: var(--bone); line-height: 34px; border: 1.5px solid var(--gold-light); padding: 12px 18px 10px; white-space: nowrap; }
 .cap { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .2em; text-transform: uppercase;
        color: var(--bone); white-space: nowrap; line-height: 1; margin: 0; }
 .ans { position: absolute; font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--gold-light); white-space: nowrap; line-height: 1; margin: 0; }
 /* structured F2 footer */
 .f2 { position: absolute; left: 72px; right: 72px; color: var(--bone); }
 .f2 .name { font-family: var(--sans); font-weight: 600; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
 .f2 .six { display: flex; align-items: center; gap: 0; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .12em;
            text-transform: uppercase; line-height: 1; white-space: nowrap; color: rgba(244,240,232,.9); }
 .f2 .six i { display: inline-block; width: 64px; height: 2px; background: var(--terracotta); margin-right: 16px; }
 .f2 .six b { font-weight: 300; letter-spacing: 0; margin-right: 18px; color: var(--gold-light); }
 .f2 .buy { display: flex; align-items: center; justify-content: space-between; }
 .f2 .price { font-family: var(--serif); font-weight: 500; font-size: 72px; line-height: .9; white-space: nowrap; }
 .f2 .offer { white-space: nowrap; padding: 13px 22px 12px; border-width: 1.5px; }
 .f2 .base { display: flex; align-items: center; justify-content: space-between; }
 .f2 .wm { height: 44px; width: auto; display: block; }
 .f2 .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; color: rgba(244,240,232,.86); }
 .f2 .rule { height: 1px; background: rgba(228,200,137,.45); }

 body { background: #F4F0E8; --fg: #4A2540; }
 .rail { color: #4A2540; line-height: 34px; }
 .eng { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--sans); font-weight: 500; font-size: 26px;
        letter-spacing: .12em; text-transform: uppercase; color: #4A2540; line-height: 1; white-space: nowrap; margin: 0; }
 .crow { position: absolute; left: 72px; right: 72px; display: grid; grid-template-columns: 76px 1fr 76px; align-items: baseline; margin: 0; }
 .crow .acu { font-family: var(--sans); font-weight: 300; font-size: 26px; color: #4A2540; letter-spacing: 0; }
 .crow .t { text-align: center; white-space: nowrap; }
 .crow .h1 { color: #4A2540; line-height: .98; }
 .acu3 { position: absolute; left: 72px; font-family: var(--sans); font-weight: 300; font-size: 26px; color: #4A2540; line-height: 1; white-space: nowrap; margin: 0; }
 .frame { position: absolute; left: 36px; top: 36px; right: 36px; border: 1px solid rgba(74,37,64,.32); border-bottom: 0; pointer-events: none; }
 .f3 { position: absolute; left: 72px; right: 72px; color: var(--bone); }
 .f3 .row1 { display: flex; justify-content: space-between; align-items: baseline; }
 .f3 .name { font-family: var(--sans); font-weight: 600; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; line-height: 1; }
 .f3 .spec { font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; line-height: 1; color: rgba(244,240,232,.9); }
 .f3 .buy { display: flex; align-items: center; justify-content: space-between; }
 .f3 .price { font-family: var(--serif); font-weight: 500; font-size: var(--pz, 72px); line-height: .9; font-feature-settings: "lnum" 1; white-space: nowrap; }
 .f3 .offer { border-width: 1.5px; padding: 13px 22px 12px; white-space: nowrap; }
 .f3 .base { display: flex; align-items: center; justify-content: space-between; }
 .f3 .wm { height: 44px; width: auto; display: block; }
 .f3 .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; color: rgba(244,240,232,.86); }
