<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../ads-500/kit/kit.css">
<!-- HEADER -->
<style>
 body { background: #1E0E10; }
 /* The picture: 1520x2688 at k 0.710526 = 1080 x 1909.89. Feed window P 29: T = 559.89 x .29 = 162.37. */
 .pic { object-position: 50% 29%; }
 svg.mist { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; mix-blend-mode: screen; opacity: .40; pointer-events: none; }
 svg.fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; pointer-events: none; }
 .band { mix-blend-mode: soft-light; }
 .osd { position: absolute; left: 72px; top: 90px; display: flex; align-items: center; gap: 14px; color: var(--bone);
        font-family: var(--sans); font-weight: 500; font-size: 30px; letter-spacing: .14em; line-height: 34px;
        text-shadow: 2px 2px 0 rgba(26,22,20,.6); white-space: nowrap; }
 .osd svg { display: block; filter: drop-shadow(2px 2px 0 rgba(26,22,20,.6)); }
 .stamp { position: absolute; left: 72px; color: var(--bone); font-family: var(--sans); font-weight: 400; font-size: 26px;
          letter-spacing: .14em; line-height: 30px; text-shadow: 2px 2px 0 rgba(26,22,20,.6), 0 0 10px rgba(26,22,20,.55); white-space: nowrap; }
 .bug { position: absolute; right: 72px; top: 84px; height: 56px; opacity: .88; }
 /* The headline split across the two worlds: SOFT, a giant 1996 title super lost in the soft-focus video;
    FOCUS., printed crisp in ink on the tape's real label, beside the only other crisp thing in the frame. */
 .giant { position: absolute; left: 72px; margin: 0; font-family: var(--display); text-transform: uppercase; font-weight: 400; line-height: 1;
          letter-spacing: .02em; color: var(--gold-light); white-space: nowrap; font-variant-ligatures: none;
          font-feature-settings: "liga" 0, "dlig" 0, "calt" 0, "swsh" 0, "salt" 0; filter: blur(5px);
          text-shadow: 0 0 24px rgba(244,240,232,.45), 0 0 60px rgba(244,240,232,.25), 0 10px 30px rgba(59,38,32,.7); }
 .print { position: absolute; left: 72px; margin: 0; font-family: var(--display); text-transform: uppercase; font-weight: 400; line-height: 1;
          letter-spacing: .04em; color: var(--ink); white-space: nowrap; font-variant-ligatures: none;
          font-feature-settings: "liga" 0, "dlig" 0, "calt" 0, "swsh" 0, "salt" 0; }
 .hand { position: absolute; font-family: var(--serif); font-style: italic; font-weight: 600; color: var(--ink); white-space: nowrap; }
 .contents { left: 72px; font-size: 34px; line-height: 40px; transform: rotate(-0.5deg); transform-origin: 0 0; }
 .lower { position: absolute; left: 0; right: 0; top: 1040px; bottom: 0; background: rgba(59,38,32,.94); border-top: 2px solid var(--gold-light); }
 .lt { position: absolute; color: var(--bone); white-space: nowrap; }
 .lt.name { left: 72px; top: 1062px; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .2em; line-height: 32px; text-transform: uppercase; }
 .lt.line { left: 72px; top: 1096px; font-family: var(--sans); font-weight: 400; font-size: 26px; letter-spacing: .02em; line-height: 32px; }
 .lt.price { right: 72px; top: 1060px; font-family: var(--serif); font-weight: 500; font-size: 64px; line-height: 64px; color: var(--gold-light);
             font-variant-numeric: lining-nums; }
 .lt.price .r { font-weight: 400; font-size: .84em; margin-right: .04em; }
 .lt.offerw { left: 72px; top: 1144px; }
 .lt .offer { color: var(--bone); }
 .lt.trust { left: 72px; top: 1222px; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: 4.02px; line-height: 32px; text-transform: uppercase; }
</style></head>
<body class="dark">
 <img class="pic" src="pics/k02-4A.png">
 <svg class="mist" viewBox="0 0 1080 1350">
  <defs>
   <filter id="sf" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="18"/>
    <feComponentTransfer><feFuncR type="linear" slope="1.12"/><feFuncG type="linear" slope="1.12"/><feFuncB type="linear" slope="1.12"/></feComponentTransfer></filter>
   <mask id="mm" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1350"><image href="masks/k02-4A_mist.png" x="0" y="-162.369" width="1080" height="1909.895" preserveAspectRatio="none"/></mask>
  </defs>
  <g mask="url(#mm)"><image href="pics/k02-4A.png" x="0" y="-162.369" width="1080" height="1909.895" preserveAspectRatio="none" filter="url(#sf)"/></g>
 </svg>
 <!-- tracking band: the tape is rewinding (background only; the pair is far below it) -->
 <svg class="fx" viewBox="0 0 1080 1350">
  <defs>
   <filter id="tn" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.06" numOctaves="2" seed="7"/>
    <feColorMatrix values="0 0 0 0 .957  0 0 0 0 .941  0 0 0 0 .91  0 0 0 1.6 -.45"/></filter>
   <linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff"/><stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
   <mask id="bm"><rect x="0" y="400" width="1080" height="70" fill="url(#bf)"/></mask>
  </defs>
  <g mask="url(#bm)">
   <rect class="band" x="0" y="400" width="1080" height="70" filter="url(#tn)" opacity=".7"/>
   <rect x="0" y="426" width="1080" height="2" fill="#F4F0E8" opacity=".35"/>
   <rect x="3" y="429" width="1080" height="1.5" fill="#ff3b3b" opacity=".35"/>
   <rect x="-3" y="431" width="1080" height="1.5" fill="#3bd5ff" opacity=".3"/>
  </g>
 </svg>
 <div class="osd" data-m="osd"><svg width="40" height="26" viewBox="0 0 40 26"><path d="M20 0 L0 13 L20 26 Z M40 0 L20 13 L40 26 Z" fill="#F4F0E8"/></svg>REW</div>
 <img class="bug" src="../../../ads-500/kit/logo_white.png">
 <p class="giant" data-m="soft" style="top:151px;font-size:270px">Soft</p>
 <p class="print" data-m="focus" style="top:716px;font-size:90px">Focus.</p>
 <div class="hand contents" data-m="contents" style="top:808px">The tape kept the shine.<br>The bangles didn’t.</div>
 <div class="stamp" data-m="stamp" style="top:962px">12 · 12 · 1996</div>
 <div class="lower"></div>
 <div class="lt name" data-m="name">Brushed Satin Hoops</div>
 <div class="lt line" data-m="line">Tarnish free · waterproof · 14 × 9.8 mm, about life size</div>
 <div class="lt price" data-m="price"><span class="r">₹</span>699</div>
 <div class="lt offerw"><div class="offer" data-m="offer">Codes BUY2 · 10% off <span class="sep"></span> BUY3 · 20% off</div></div>
 <div class="lt trust" data-m="trust">Free insured shipping · Cash on delivery</div>
</body></html>
