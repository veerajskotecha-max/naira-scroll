<style>
 body { background: #120808; }
 .pic { object-position: 50% 47%; }
 svg.lens, svg.ovl { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
 svg .ins { font-family: var(--sans); font-weight: 500; fill: var(--gold-light); dominant-baseline: central; }
 .scrim { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
 .rail { position: absolute; margin: 0; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .14em; text-transform: uppercase;
         color: var(--gold-light); white-space: nowrap; line-height: 34px; }
 .chart { position: absolute; margin: 0; }
 .chart .row { display: flex; align-items: baseline; white-space: nowrap; }
 .chart .acu { flex: none; width: 76px; font-family: var(--sans); font-weight: 300; font-size: 26px; letter-spacing: 0; color: var(--gold-light); }
 .chart .h1 { color: var(--bone); line-height: .98; }
 .beat { position: absolute; margin: 0; white-space: nowrap; color: var(--gold-light); line-height: 1.1; }
 .bar { position: absolute; display: flex; align-items: center; white-space: nowrap; font-family: var(--sans); font-weight: 500; font-size: 26px;
        letter-spacing: .16em; text-transform: uppercase; color: var(--bone); line-height: 34px; }
 .bar .chip { display: block; margin-right: 14px; flex: none; }
 .bar .cl { display: block; flex: none; margin: 0 18px 0 12px; }
 .bar .cl.dbl { margin: 0 22px 0 16px; }
 .f2 { position: absolute; left: 72px; right: 72px; color: var(--bone); }
 .f2 .name { font-family: var(--sans); font-weight: 600; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
 .f2 .six { display: flex; align-items: center; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .12em;
            text-transform: uppercase; line-height: 1; white-space: nowrap; color: rgba(244,240,232,.92); }
 .f2 .six i { display: inline-block; width: 64px; height: 2px; background: var(--terracotta); margin-right: 16px; }
 .f2 .six b { font-weight: 300; letter-spacing: 0; margin-right: 18px; color: var(--gold-light); }
 .f2 .buy { display: flex; align-items: center; justify-content: space-between; }
 .f2 .price { font-family: var(--serif); font-weight: 500; font-size: 72px; line-height: .9; white-space: nowrap; font-feature-settings: "lnum" 1; }
 .f2 .offer { white-space: nowrap; padding: 13px 22px 12px; border-width: 1.5px; }
 .f2 .base { display: flex; align-items: center; justify-content: space-between; }
 .f2 .wm { height: 44px; width: auto; display: block; }
 .f2 .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; color: rgba(244,240,232,.86); }
 .f2 .rule { height: 1px; background: rgba(228,200,137,.45); }

 svg.glass { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
 .cc { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; color: var(--bone); text-align: center; }
 .cc .name { font-family: var(--sans); font-weight: 600; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
 .cc .price { font-family: var(--serif); font-weight: 500; font-size: 76px; line-height: .9; white-space: nowrap; font-feature-settings: "lnum" 1; }
 .cc .offer { white-space: nowrap; padding: 13px 22px 12px; border-width: 1.5px; }
 .cc .wm { height: 44px; width: auto; display: block; }
 .cc .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; color: rgba(244,240,232,.9); line-height: 1; }
 .cc .np { display: flex; align-items: baseline; gap: 26px; }
 .chart.ctr { left: 0; right: 0; }
 .chart.ctr .row { justify-content: center; position: relative; }
 .chart.ctr .acu { position: absolute; left: 72px; width: auto; }
 .hint { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-light); white-space: nowrap; line-height: 1; }

</style></head>
