<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../ads-500/kit/kit.css">
<!-- k05-3 V2 (draft) -->
<style>
 body { background: #EED5AB; }
 .pic { object-position: 50% 36%; }
 :root { --sun: 14.036deg; --shade: #31271C; --wall: #EED5AB; }
 .kick { position: absolute; left: 72px; top: 88px; font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 32px;
         letter-spacing: .14em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
 .obj { position: absolute; left: 72px; top: 170px; font-size: 88px; white-space: nowrap; }
 svg.ts { position: absolute; inset: 0; width: 1080px; height: 1350px; mix-blend-mode: multiply; pointer-events: none; overflow: visible; }
 svg.ts text { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 68px; fill: var(--shade); }
 .ray { position: absolute; font-family: var(--sans); font-size: 26px; line-height: 30px; white-space: nowrap; color: var(--ink);
        transform-origin: 0 100%; transform: rotate(var(--sun)); }
 .ray.cap { font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
 .ray.low { font-weight: 400; letter-spacing: .01em; transform-origin: 0 0; }
 .sz { position: absolute; left: 72px; font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 32px;
       letter-spacing: .12em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
 .card2 { position: absolute; left: 72px; width: 336px; color: var(--ink); }
 .card2 .wm { height: 32px; display: block; }
 .card2 .name { font-family: var(--sans); font-weight: 600; font-size: 26px; line-height: 30px; letter-spacing: .01em; margin-top: 16px; white-space: nowrap; }
 .card2 .price { font-family: var(--serif); font-weight: 500; font-size: 60px; line-height: 52px; margin-top: 10px; }
 .card2 .codes { position: relative; margin-top: 30px; border: 1.5px solid var(--ink); padding: 17px 20px 8px; }
 .card2 .codes .lg { position: absolute; top: -16px; left: 14px; background: var(--wall); padding: 0 10px; font-family: var(--sans); font-weight: 500;
       font-size: 26px; line-height: 30px; letter-spacing: .16em; text-transform: uppercase; }
 .card2 .codes .row { font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 32px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
 .card2 .codes .div { position: relative; height: 10px; }
 .card2 .codes .div:before { content: ""; position: absolute; left: 0; right: 0; top: 5px; border-top: 1px solid rgba(26,22,20,.3); }
 .card2 .codes .div i { position: absolute; left: 50%; top: .5px; width: 9px; height: 9px; margin-left: -5px; background: var(--coral-deep); transform: rotate(45deg); }
 .card2 .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; line-height: 28px; letter-spacing: .12em; text-transform: uppercase; margin-top: 18px; white-space: nowrap; }
</style></head>
<body>
 <img class="pic" src="pics/k05-3R.png" alt="">
 <div class="kick">Is one bangle<br>enough?</div>
 <p class="h1 obj">One<br>Wire.</p>
 <svg class="ts" viewBox="0 0 1080 1350">
  <defs>
   <filter id="b1" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation=".45"/></filter>
   <filter id="b2" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation=".95"/></filter>
  </defs>
  <text transform="translate(86 404) skewX(10) scale(1 1.16)">already</text>
  <text transform="translate(86 478) skewX(10) scale(1 1.16)" filter="url(#b1)">a stack.</text>
 </svg>
 <svg class="overlay" viewBox="0 0 1080 1350">
  <g stroke="#1A1614" stroke-width="1.5" fill="none">
   <circle cx="7" cy="561.25" r="7" fill="#1A1614" stroke="none"/>
   <line x1="14" y1="563" x2="401.2" y2="659.8" stroke-opacity=".6"/>
   <circle cx="406" cy="661" r="5"/>
   <line x1="0" y1="624.75" x2="404.2" y2="725.8" stroke-opacity=".6"/>
   <circle cx="409" cy="727" r="5"/>
   <line x1="300" y1="868" x2="729" y2="868" stroke-opacity=".7"/>
   <line x1="391" y1="861" x2="391" y2="875"/><line x1="729" y1="861" x2="729" y2="875"/>
  </g>
 </svg>
 <div class="ray cap" style="left:80px;top:543px">4:29 PM · 21 Dec</div>
 <div class="ray cap" style="left:80px;top:608px;letter-spacing:.12em">Two turns · 8 mm</div>
 <div class="ray low" style="left:80px;top:653px">12 mm where they cross</div>
 <div class="sz" style="top:772px">6 cm inside ·<br>the other bangles<br>not included</div>
 <div class="card2" style="top:902px">
  <img class="wm" src="../../../ads-500/kit/logo_ink.png" alt="Naira">
  <div class="name">Triple Coil Wrap Bangle.</div>
  <div class="price">₹1,149</div>
  <div class="codes"><span class="lg">Codes</span><div class="row">BUY2 · 10% off</div><div class="div"><i></i></div><div class="row">BUY3 · 20% off</div></div>
  <div class="trust">Free insured shipping ·<br>Cash on delivery</div>
 </div>
</body></html>
