<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../ads-500/kit/kit.css">
<!-- k05-3 V1 (draft) -->
<style>
 body { background: #EED5AB; }
 .pic { object-position: 50% 36%; }
 :root { --sun: 14.036deg; --shade: #31271C; }
 .obj { position: absolute; left: 72px; top: 108px; font-size: 70px; white-space: nowrap; }
 /* THE DOUBLE LINE: type-shadow, a stack of three short lines that falls the way the plate's shadow arm falls */
 .ts { position: absolute; left: 77px; margin: 0; white-space: nowrap; font-family: var(--serif); font-style: italic; font-weight: 500;
       font-size: 58px; line-height: 60px; color: var(--shade); mix-blend-mode: multiply; transform-origin: 0 0;
       transform: skewX(12deg) scaleY(1.16); }
 .ts.l2 { filter: blur(.7px); }
 .ts.l3 { filter: blur(1.4px); }
 /* the light slivers between the shadow's bangles, at the plate's slope */
 .ts.lit { -webkit-mask-image: repeating-linear-gradient(192.7deg, #000 0 11px, transparent 11px 14.5px);
           mask-image: repeating-linear-gradient(192.7deg, #000 0 11px, transparent 11px 14.5px); }
 .ray { position: absolute; font-family: var(--sans); font-size: 26px; line-height: 30px; white-space: nowrap; color: var(--ink);
        transform-origin: 0 100%; transform: rotate(var(--sun)); }
 .ray.cap { font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
 .ray.low { font-weight: 400; letter-spacing: .01em; transform-origin: 0 0; }
 .sz { position: absolute; left: 72px; font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 32px;
       letter-spacing: .12em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
 .card2 { position: absolute; left: 72px; width: 330px; color: var(--ink); }
 .card2 .wm { height: 44px; display: block; }
 .card2 .name { font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 32px; letter-spacing: .16em; text-transform: uppercase; margin-top: 14px; }
 .card2 .price { font-family: var(--serif); font-weight: 500; font-size: 60px; line-height: 1; margin-top: 8px; }
 .card2 .codes { position: relative; margin-top: 16px; border: 1.5px solid var(--ink); padding: 14px 18px 10px; display: inline-block; }
 .card2 .codes .lg { position: absolute; top: -15px; left: 14px; background: #EED5AB; padding: 0 8px; font-family: var(--sans); font-weight: 500;
       font-size: 22px; line-height: 28px; letter-spacing: .16em; text-transform: uppercase; }
 .card2 .codes .row { font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 34px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
 .card2 .codes .sep { display: inline-block; width: 9px; height: 9px; background: var(--coral-deep); transform: rotate(45deg); vertical-align: middle; margin: -4px 14px 0 2px; }
 .card2 .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; line-height: 28px; letter-spacing: .14em; text-transform: uppercase; margin-top: 14px; }
</style></head>
<body>
 <img class="pic" src="pics/k05-3R.png" alt="">
 <p class="h1 obj">Two<br>Turns.</p>
 <p class="ts" style="top:262px">a whole</p>
 <p class="ts l2 lit" style="top:332px">stack,</p>
 <p class="ts l3" style="top:402px">for didi;</p>
 <svg class="overlay" viewBox="0 0 1080 1350">

   <circle cx="7" cy="561.25" r="7" fill="#1A1614" stroke="none"/>
   <line x1="14" y1="563" x2="401.2" y2="659.8" stroke-opacity=".55"/>
   <circle cx="406" cy="661" r="5"/>
   <line x1="0" y1="605.5" x2="393.2" y2="703.8" stroke-opacity=".55"/>
   <circle cx="398" cy="705" r="5"/>
   <!-- size: dimension line spanning the coil's outline, labelled outside on the wall -->
   <line x1="312" y1="868" x2="729" y2="868" stroke-opacity=".7"/>
   <line x1="391" y1="861" x2="391" y2="875"/><line x1="729" y1="861" x2="729" y2="875"/>
  </g>
 </svg>
 <div class="ray cap" style="left:72px;top:541px">4:29 PM · 21 Dec</div>
 <div class="ray cap" style="left:72px;top:588px">One wire</div>

 </div>
</body></html>
