<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../ads-500/kit/kit.css">
<!-- k05-1 V1 · draft -->
<style>
 body { background: #CDB197; }
 .pic { object-position: 50% 18%; }

 /* 1 · OBJECT LINE, in the light: Velista caps, ink, x 72 */
 .obj { position: absolute; left: 72px; top: 128px; font-size: 128px; line-height: .98; letter-spacing: .02em; white-space: nowrap; }
 .obj .kTW { letter-spacing: -.045em; }

 /* 2 · TYPE-SHADOW, hung from the object line's baseline, leaning with the plate (16 deg), stretched like a low-sun shadow */
 .ts { position: absolute; left: 72px; top: 356px; width: 600px; height: 120px; transform-origin: 0 0; transform: skewX(16deg) scaleY(1.45); }
 .ts.sh { mix-blend-mode: multiply; }
 .ts.lt { mix-blend-mode: screen; }
 .ts p { position: absolute; left: 0; top: -19.7px; margin: 0; white-space: nowrap; font-family: var(--serif); font-style: italic;
         font-weight: 500; font-size: 92px; line-height: 92px; letter-spacing: .01em; color: #3B2620; }
 .ts p .w { color: transparent; }
 .ts .a { -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 40px, transparent 52px); mask-image: linear-gradient(to bottom, #000 0, #000 40px, transparent 52px); }
 .ts .b { filter: blur(2.4px); -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent 36px, #000 50px); mask-image: linear-gradient(to bottom, transparent 0, transparent 36px, #000 50px); }
 /* the pool: the shadow that the lit word sits inside (the crystal's caustic glows inside the joined hands' shadow) */
 .ts .pool { color: transparent; }
 .ts .pool .w { color: #3B2620; -webkit-text-stroke: 9px #3B2620; filter: blur(7px); }
 /* 3 · THE LIGHT IN THE TYPE: 'aur' alone is lit */
 .ts .lit { color: transparent; }
 .ts .lit .w { color: rgba(244,240,232,.92); text-shadow: 0 0 8px rgba(242,214,168,.85), 0 0 2px rgba(244,240,232,.7); }

 /* 4 · THE SUN label, 5 · SIZE LINE labels */
 .lab { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 32px; letter-spacing: .14em;
        text-transform: uppercase; white-space: nowrap; color: var(--ink); }
 .lab.sz { letter-spacing: .12em; }

 /* F2 footer on the ledge face, one grid at x 72 to 1008 */
 .ftr { position: absolute; left: 72px; right: 72px; color: var(--ink); }
 .ftr .r1 { font-family: var(--sans); font-weight: 400; font-size: 26px; line-height: 34px; white-space: nowrap; letter-spacing: .01em; }
 .ftr .r1 b { font-weight: 600; margin-right: 8px; }
 .ftr .r2 { display: flex; align-items: center; gap: 30px; margin-top: 14px; }
 .ftr .price { font-family: var(--serif); font-weight: 500; font-size: 74px; line-height: 1; flex: none; letter-spacing: -.01em; }
 .ftr .offer { flex: 1; text-align: center; white-space: nowrap; padding: 12px 18px; border-width: 1.5px; }
 .ftr .r3 { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 14px;
            border-top: 1px solid rgba(26,22,20,.45); }
 .ftr .r3 img { height: 44px; display: block; }
 .ftr .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
</style></head>
<body>
 <img class="pic" src="pics/k05-1A.png" alt="">

 <p class="h1 obj"><span class="kTW">T</span>wo<br>Stones.</p>

 <div class="ts sh">
  <p class="pool">tum <span class="w">aur</span> main.</p>
  <p class="a">tum <span class="w">aur</span> main.</p>

   <circle cx="300.3" cy="654.9" r="5" stroke-width="1.5"/>
   <line x1="15" y1="571" x2="78" y2="571" stroke-width="1" stroke-opacity=".5" stroke-dasharray="3 4"/>
   <path d="M 70 571 A 62 62 0 0 1 68.6 588.1" stroke-width="1" stroke-opacity=".6"/>
   <!-- dimension lines, architect's oblique ticks: the ring (solid), the shadow (dashed) -->
   <g stroke-width="1.5">

    <line x1="143" y1="974" x2="155" y2="962"/><line x1="587" y1="974" x2="599" y2="962"/>
    <line x1="149" y1="958" x2="149" y2="978" stroke-width="1"/><line x1="593" y1="958" x2="593" y2="978" stroke-width="1"/>
    <line x1="625" y1="968" x2="960" y2="968" stroke-dasharray="5 6"/>
    <line x1="619" y1="974" x2="631" y2="962"/><line x1="954" y1="974" x2="966" y2="962"/>
   </g>
  </g>
  <circle cx="8" cy="571" r="7" fill="#1A1614"/>
 </svg>
 <div class="lab" style="left:72px;top:527px">3:58 PM · 21 Dec</div>
 <div class="lab sz" style="left:224px;top:976px">Ring 17 mm inside</div>

  <div class="r2"><span class="price">₹899</span><span class="offer">Codes BUY2 · 10% off <span class="sep"></span> BUY3 · 20% off</span></div>

 </div>
