<style>

 .ftr .offer { flex: 1; text-align: center; white-space: nowrap; padding: 12px 20px; }
 .ftr .r3 { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 14px;
            border-top: 1.5px solid rgba(26,22,20,.32); }
 .ftr .r3 img { height: 46px; display: block; }
 .ftr .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
