<style>
 body { background: #CDB197; }
 .pic { object-position: 50% 50%; }

 /* 1 · OBJECT LINE (in the light): Velista caps, ink */
 .obj { position: absolute; left: 72px; line-height: .98; letter-spacing: .02em; white-space: nowrap; margin: 0; }
 .obj .kTW { letter-spacing: -.045em; }
 /* 2 · TYPE-SHADOW (the meaning): Cormorant italic, cocoa, multiplied into the plaster, leaning and stretched like the plate's shadow.
    Copy a is the sharp contact, b and c the softening penumbra, pen a soft fringe outside the umbra that widens with distance. */
 .ts { position: absolute; transform-origin: 0 0; }
 .sh { mix-blend-mode: multiply; }
 .lt { mix-blend-mode: screen; }
 .ts p { position: absolute; left: 0; top: 0; margin: 0; white-space: nowrap; font-family: var(--serif); font-style: italic;
         font-weight: 500; letter-spacing: .01em; color: #3B2620; }
 .ts p .w { color: transparent; }
 .ts .pen { -webkit-text-stroke: 4px #3B2620; filter: blur(4px); opacity: .34; }
 .ts .pool { color: transparent; }
 .ts .pool .w { color: #3B2620; -webkit-text-stroke: 8px #3B2620; filter: blur(6px); }
 /* 3 · THE LIGHT IN THE TYPE: bone, screened, a warm 7 px glow, the same lean */
 .ts .lit { color: transparent; }
 .ts .lit .w { color: rgba(244,240,232,.93); text-shadow: 0 0 7px rgba(242,214,168,.8), 0 0 2px rgba(244,240,232,.6); }
 /* 4 · THE SUN and 5 · THE SIZE LINE: Jost 500 26 caps */
 .lab { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 34px; letter-spacing: .14em;
        text-transform: uppercase; white-space: nowrap; color: var(--ink); margin: 0; }

 .ftr .r2 { display: flex; align-items: center; gap: 30px; }
 .ftr .price { font-family: var(--serif); font-weight: 500; line-height: 1; flex: none; letter-spacing: -.01em; }
 .ftr .price .r { font-size: .74em; font-weight: 400; margin-right: .04em; }
 .ftr .offer { flex: 1; text-align: center; white-space: nowrap; padding: 12px 16px; border-width: 1.5px; }
 .ftr .r3 { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(26,22,20,.45); }
 .ftr .r3 img { display: block; }
 .ftr .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
