<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../ads-500/kit/kit.css">
<!-- k05-3 V3 story (draft) -->
<style>
 body { background: #EED5AB; }
 :root { --shade: #31271C; --wall: #EED5AB; }
 .kick { position: absolute; left: 72px; top: 280px; font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 32px;
         letter-spacing: .14em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
 .obj { position: absolute; left: 72px; top: 354px; font-size: 112px; white-space: nowrap; }
 svg.ts { position: absolute; inset: 0; width: 1080px; height: 1920px; mix-blend-mode: multiply; pointer-events: none; overflow: visible; }
 svg.ts text { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; fill: var(--shade); }
 .hr { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 32px; letter-spacing: .14em;
       text-transform: uppercase; color: var(--ink); white-space: nowrap; }
 .card2 { position: absolute; left: 72px; width: 300px; color: var(--ink); }
 .card2 .wm { height: 30px; display: block; }
 .card2 .name { font-family: var(--sans); font-weight: 600; font-size: 26px; line-height: 30px; letter-spacing: .01em; margin-top: 14px; white-space: nowrap; }
 .card2 .price { font-family: var(--serif); font-weight: 500; font-size: 56px; line-height: 48px; margin-top: 8px; }
 .card2 .line { font-family: var(--sans); font-weight: 400; font-size: 26px; line-height: 30px; letter-spacing: .01em; margin-top: 10px; white-space: nowrap; }
 .card2 .codes { position: relative; margin-top: 30px; border: 1.5px solid var(--ink); padding: 16px 18px 7px; width: 284px; }
 .card2 .codes .lg { position: absolute; top: -16px; left: 12px; background: var(--wall); padding: 0 9px; font-family: var(--sans); font-weight: 500;
       font-size: 26px; line-height: 30px; letter-spacing: .16em; text-transform: uppercase; }
 .card2 .codes .row { font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 30px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
 .card2 .codes .div { position: relative; height: 10px; }
 .card2 .codes .div:before { content: ""; position: absolute; left: 0; right: 0; top: 5px; border-top: 1px solid rgba(26,22,20,.3); }
 .card2 .codes .div i { position: absolute; left: 50%; top: .5px; width: 9px; height: 9px; margin-left: -5px; background: var(--coral-deep); transform: rotate(45deg); }
 .card2 .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; line-height: 26px; letter-spacing: .12em; text-transform: uppercase; margin-top: 14px; white-space: nowrap; }
</style></head>
<body class="story">
 <img class="pic" src="pics/k05-3R.png" alt="">
 <div class="kick">Is one bangle<br>enough?</div>
 <p class="h1 obj">One.</p>
 <svg class="ts" viewBox="0 0 1080 1920">
  <defs>
   <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
   <filter id="pen" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation=".5"/></filter>
   <g id="sl">
    <line x1="40" y1="494" x2="330" y2="566.5"/>
    <line x1="40" y1="527" x2="330" y2="599.5"/>
    <line x1="40" y1="575" x2="330" y2="647.5"/>
    <line x1="40" y1="606" x2="330" y2="678.5"/>
    <line x1="40" y1="650" x2="330" y2="722.5"/>
    <line x1="40" y1="679" x2="330" y2="751.5"/>
    <line x1="40" y1="722" x2="330" y2="794.5"/>
   </g>
   <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
    <rect width="1080" height="1920" fill="#fff"/>
    <use href="#sl" stroke="#000" stroke-width="6" filter="url(#soft)"/>
   </mask>
   <clipPath id="word"><text font-size="166" transform="translate(122 466) rotate(90)">stack.</text></clipPath>
  </defs>
  <g mask="url(#cut)" filter="url(#pen)"><text font-size="166" transform="translate(122 466) rotate(90)">stack.</text></g>
  <g clip-path="url(#word)"><use href="#sl" stroke="#E7B46E" stroke-width="4.5" stroke-opacity=".75" filter="url(#soft)"/></g>
 </svg>
 <svg class="overlay" viewBox="0 0 1080 1920">
  <g stroke="#1A1614" stroke-width="1.5" fill="none">
   <circle cx="7" cy="767.3" r="7" fill="#1A1614" stroke="none"/>
   <line x1="14" y1="769" x2="400.6" y2="865.7" stroke-opacity=".6"/>

  </g>

 <div class="hr" style="left:264px;top:700px">4:29 PM<br>21 Dec</div>

  <div class="price">₹1,149</div>

</body></html>
