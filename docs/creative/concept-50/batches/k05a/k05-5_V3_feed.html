<style>
 body { background: #E9946B; }
 .pic { object-position: 50% 30%; }

 .obj { position: absolute; left: 72px; top: 84px; font-size: 150px; line-height: .98; white-space: nowrap; }
 svg.seal { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; overflow: visible; pointer-events: none; }

 .med { position: absolute; transform: translate(-50%, -50%); text-align: center; color: var(--ink); }

 .lab { position: absolute; margin: 0; font-family: var(--sans); font-weight: 500; font-size: 26px; line-height: 30px; letter-spacing: .12em;
        text-transform: uppercase; white-space: nowrap; color: var(--ink); }
 .ftr { position: absolute; left: 72px; right: 72px; color: var(--ink); }
 .ftr .cols { display: flex; align-items: center; justify-content: space-between; }
 .ftr .nm { font-family: var(--sans); font-weight: 600; font-size: 26px; line-height: 32px; white-space: nowrap; }
 .ftr .fx { font-family: var(--sans); font-weight: 400; font-size: 26px; line-height: 32px; white-space: nowrap; }
 .box { width: 590px; border: 1.5px solid var(--ink); padding: 13px 16px 12px; text-align: center; }
 .box .b3 { font-family: var(--sans); font-weight: 500; font-size: 30px; line-height: 36px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }

 .ftr .r3 { display: flex; justify-content: flex-end; border-top: 1px solid rgba(26,22,20,.45); margin-top: 16px; padding-top: 12px; }
 .ftr .trust { font-family: var(--sans); font-weight: 500; font-size: 22px; line-height: 26px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
