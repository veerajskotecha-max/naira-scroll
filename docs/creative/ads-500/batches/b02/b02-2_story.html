<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/kit.css">
<!-- b02-2 Brushed Gold Huggies · A13 Story twin: the native 9:16 frame. Every word sits on the plain sky wall above the pair
     (huggies at Story y 822-1093, shadows 1320-1376). Stack: wordmark 270-326, headline 372, beat 470, name and price 562,
     offer 652-714, so about 108 px of plain wall stays above the pair. No size tag: about 17 px/mm, under 19.
     Accent: --oxblood for the beat and the lozenge (coral-deep is 1.8:1 on this sky). · Story 1080x1920 -->
<style>
 body { background: #7FB2D0; --accent: var(--oxblood); }
 .wm-top { top: 270px; }
 .hl { position: absolute; left: 0; right: 0; top: 372px; margin: 0; text-align: center; font-family: var(--serif); font-style: italic;
       font-weight: 500; font-size: 80px; line-height: 1.02; color: var(--ink); }
 .beat { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-size: 52px; }
 .np { position: absolute; left: 0; right: 0; top: 562px; display: flex; justify-content: center; align-items: baseline; gap: 24px;
       color: var(--ink); }
 .np .name { font-family: var(--sans); font-weight: 500; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; }
 .np .price { font-family: var(--serif); font-weight: 500; font-size: 56px; line-height: 1; }
 .of { position: absolute; left: 0; right: 0; top: 652px; text-align: center; color: var(--ink); }
 body:not(.dark) .of .offer .sep { background: var(--oxblood); }
</style></head>
<body class="story">
 <img class="pic" src="pics/b02-2.png">
 <img class="wm-top" src="../../kit/logo_ink.png">
 <p class="hl">The ₹699 pair.</p>
 <p class="beat">any three pieces, 20% off.</p>
 <div class="np"><span class="name">Brushed Gold Huggies</span><span class="price">₹699</span></div>
 <div class="of"><div class="offer">Codes BUY2 · 10% off <span class="sep"></span> BUY3 · 20% off</div></div>
</body></html>
