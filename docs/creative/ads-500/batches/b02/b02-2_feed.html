<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/kit.css">
<!-- b02-2 Brushed Gold Huggies · A13 Suspended (the float, detached shadows) · Feed 1080x1350.
     Crop (RULINGS 4, amended 19 Nov): P 85, T 497 (loop.md said P 80; at 80 the shadows end 25 px over the wordmark).
     Huggies at Feed 333-603, shadows 831-886, all on plain sky; gaps of about 56 px to the beat and 54 px to the card.
     Headline: A13 allows Cormorant italic 96 when the headline holds a price (no digits or rupee in Velista).
     Accent: the kit's coral-deep reads 1.8:1 on this sky, so the beat and the lozenge take --oxblood (5.3:1). -->
<style>
 body { background: #86B9D5; --accent: var(--oxblood); }
 .pic { object-position: 50% 85%; }
 .hl { position: absolute; left: 0; right: 0; top: 96px; margin: 0; text-align: center; font-family: var(--serif); font-style: italic;
       font-weight: 500; font-size: 96px; line-height: 1.02; color: var(--ink); }
 .beat { position: absolute; left: 0; right: 0; top: 214px; text-align: center; font-size: 60px; }
 .card { color: var(--ink); }
 body:not(.dark) .card .offer .sep { background: var(--oxblood); }
</style></head>
<body>
 <img class="pic" src="pics/b02-2.png">
 <p class="hl">The ₹699 pair.</p>
 <p class="beat">any three pieces, 20% off.</p>
 <div class="card" style="top:940px">
  <img class="wm" src="../../kit/logo_ink.png">
  <div class="name">Brushed Gold Huggies</div>
  <div class="price">₹699</div>
  <div class="line">about 14 mm · brushed satin, 18k gold tone</div>
  <div class="offer">Codes BUY2 · 10% off <span class="sep"></span> BUY3 · 20% off</div>
 </div>
</body></html>
